name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Catches a broken release config here rather than at release time. Needs
      # no credentials: only the two plugins that read commits are loaded.
      # The branch is recreated because a PR checkout is detached at the merge
      # ref, which matches no branch semantic-release would release from.
      - name: Dry-run the release
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          # semantic-release reads the branch from GITHUB_REF, which on a PR is
          # the merge ref, and skips the run outright when the event is a PR.
          GITHUB_REF: refs/heads/${{ github.head_ref || github.ref_name }}
          GITHUB_EVENT_NAME: push
        run: |
          git switch -C "$BRANCH"
          npx semantic-release --dry-run --branches "$BRANCH" --plugins @semantic-release/commit-analyzer @semantic-release/release-notes-generator
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
